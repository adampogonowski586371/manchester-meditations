backend:
  name: github
  repo: adampogonowski586371/manchester-meditations
  branch: main
  base_url: https://manchester-meditations.netlify.app
  auth_endpoint: .netlify/functions/auth
publish_mode: editorial_workflow
media_folder: "uploads"
public_folder: "/uploads"
collections:
  - name: "posts"
    label: "Observations"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "post" }

  - name: "meditations"
    label: "Meditations"
    folder: "meditations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "meditation.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "meditations" }

  - name: "about"
    label: "About Page"
    files:
      - file: "about.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/about/" }
          - { label: "Body", name: "body", widget: "markdown" }
